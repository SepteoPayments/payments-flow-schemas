name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package.json version $VERSION (expected v$VERSION)"
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npm publish
        env:
          AZURE_NPM_PUBLISH_TOKEN: ${{ secrets.AZURE_NPM_PUBLISH_TOKEN }}
